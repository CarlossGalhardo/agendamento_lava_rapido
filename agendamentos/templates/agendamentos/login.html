{% extends "base.html" %}

{% block title %}Login do Dono - Lava Rápido{% endblock %}

{% block content %}
<div class="container py-5 my-md-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">

            <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
                <div class="text-center mb-4">
                    <div class="rounded-circle bg-primary-subtle text-primary d-inline-flex p-3 mb-3">
                        <i class="bi bi-shield-lock-fill display-6"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Área do Dono</h3>
                    <p class="text-muted small">Acesse o painel para gerenciar os agendamentos</p>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold small">Usuário</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control bg-light border-start-0" id="username" name="username" placeholder="Digite seu usuário" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold small">Senha</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control bg-light border-start-0" id="password" name="password" placeholder="Digite sua senha" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold shadow-sm d-flex align-items-center justify-content-center gap-2">
                        <i class="bi bi-box-arrow-in-right"></i> Entrar no Painel
                    </button>
                </form>

                <div class="alert alert-secondary mt-4 mb-0 py-2 px-3 rounded-3 small">
                    <div class="d-flex align-items-center gap-2 mb-1 fw-semibold text-dark">
                        <i class="bi bi-info-circle-fill text-primary"></i> Acesso Padrão Configurado:
                    </div>
                    <div>Usuário: <code>admin</code></div>
                    <div>Senha: <code>admin123</code></div>
                </div>

                <div class="text-center mt-3">
                    <a href="{% url 'home' %}" class="text-muted small text-decoration-none">
                        <i class="bi bi-arrow-left"></i> Voltar para a página pública
                    </a>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
