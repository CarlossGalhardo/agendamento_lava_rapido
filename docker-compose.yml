services:
  db:
    image: postgres:16-alpine
    container_name: lavarapido_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: lavarapido_db
      POSTGRES_USER: lavarapido_user
      POSTGRES_PASSWORD: lavarapido_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lavarapido_user -d lavarapido_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: lavarapido_web
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=lavarapido_db
      - DB_USER=lavarapido_user
      - DB_PASSWORD=lavarapido_password
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
